[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toonshorts"
version = "0.2.0"
description = "AI animated story pipeline for YouTube Shorts"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic==2.13.3",
    "google-genai==2.31.0",
    "pillow==12.2.0",
    "python-dotenv==1.2.2",
    "faster-whisper==1.2.1",
    "pyttsx3==2.99",
    "numpy==2.4.4",
    "pytest==9.1.1",
    "pycairo>=1.26.0",
]

[project.scripts]
toonshorts = "toonshorts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -s"
