    <!-- Heel shadow/contour accent -->
    <path fill="#432247" d="M545 1370 L532 1372 L528 1436 L542 1438 Z" />

    <!-- White rubber toe cap (Solid 3D volume matching source) -->
    <!-- Top slope facet -->
    <path fill="#ffffff" stroke="#1b1516" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" d="M654 1420 L596 1424 L596 1444 L655 1448 L692 1436 Z" />
