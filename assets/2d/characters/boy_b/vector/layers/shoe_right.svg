    <!-- 4 White Laces Bars across instep -->
    <path fill="#ffffff" stroke="#1b1516" stroke-width="2.5" stroke-linejoin="round" d="M617 1368 L564 1369 L569 1378 L622 1377 Z" />
    <path fill="#ffffff" stroke="#1b1516" stroke-width="2.5" stroke-linejoin="round" d="M627 1382 L574 1384 L579 1393 L632 1391 Z" />
    <path fill="#ffffff" stroke="#1b1516" stroke-width="2.5" stroke-linejoin="round" d="M637 1396 L584 1399 L589 1408 L642 1405 Z" />
    <path fill="#ffffff" stroke="#1b1516" stroke-width="2.5" stroke-linejoin="round" d="M647 1410 L593 1414 L598 1423 L652 1419 Z" />

    <!-- Lateral purple canvas quarter (heel counter / side panel) -->
