    <!-- White sock sliver on medial side -->
    <path fill="#edf0f5" stroke="#1b1516" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" d="M558 1338 L532 1338 L532 1368 L558 1368 Z" />
    
    <!-- Purple tongue (flat/angled top sticking out under cuff) -->
