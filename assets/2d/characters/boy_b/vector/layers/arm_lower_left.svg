<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <g id="layer_arm_lower_left">
    <!-- Elbow overlap cap extending into upper sleeve -->
    <circle cx="390" cy="660" r="28" fill="#3b689a" stroke="#1b1516" stroke-width="6" />
    <!-- Lower arm sleeve body -->
    <path fill="#3b689a" stroke="#1b1516" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M362 655 L315 775 L372 795 L418 665 Z" />
    <path fill="#4f82ba" stroke="#1b1516" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M368 655 L325 775 L368 792 L412 665 Z" />
    <!-- Wrist hoodie cuff (covers hand joint cap) -->
    <g transform="rotate(20, 345, 785)">
      <rect x="306" y="768" width="76" height="34" rx="7" fill="#3b689a" stroke="#1b1516" stroke-width="6" />
      <rect x="309" y="771" width="70" height="28" rx="5" fill="#4f82ba" stroke="#1b1516" stroke-width="3" />
    </g>
    <!-- Redrawn Hand matching hands sheet -->
    <g id="boy_hand_l">
      <!-- Wrist link under cuff -->
      <path fill="#db9c79" stroke="#1b1516" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" d="M330 795 L318 840 L358 852 L365 802 Z" />
      <!-- Palm Base -->
      <path fill="#db9c79" stroke="#1b1516" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" d="M320 835 C308 860 308 880 318 900 C326 910 344 910 354 900 C366 888 368 860 362 835 Z" />
      <path fill="#f3be9b" stroke="#1b1516" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" d="M324 840 C314 860 314 878 322 895 C328 902 342 902 350 895 C360 885 362 860 356 840 Z" />
      <!-- Inward Thumb -->
      <path fill="#f3be9b" stroke="#1b1516" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" d="M352 840 C366 850 374 865 370 877 C364 885 354 881 348 870 Z" />
      <!-- Subtle Finger Crease Strokes -->
      <line x1="330" y1="901" x2="330" y2="870" stroke="#2b1d1f" stroke-width="3" stroke-linecap="round" />
      <line x1="339" y1="903" x2="339" y2="865" stroke="#2b1d1f" stroke-width="3" stroke-linecap="round" />
      <line x1="347" y1="899" x2="347" y2="868" stroke="#2b1d1f" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>
</svg>