<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <g id="layer_shoe_left">
    <!-- Ankle joint cap (tucks under jeans cuff at (420, 1345)) -->
    <circle cx="420" cy="1345" r="36" fill="#432247" stroke="#1b1516" stroke-width="5" />
    <!-- White sock sliver on medial side -->
    <path fill="#edf0f5" stroke="#1b1516" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" d="M442 1338 L468 1338 L468 1368 L442 1368 Z" />
    
    <!-- Purple tongue (flat/angled top sticking out under cuff) -->
    <path fill="#5e3364" stroke="#1b1516" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" d="M384 1338 L442 1338 L440 1364 L386 1364 Z" />
    
    <!-- Throat / Instep Underlay (dark purple canvas behind laces) -->
    <path fill="#432247" stroke="#1b1516" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" d="M386 1364 L440 1364 L404 1442 L346 1420 Z" />
    
    <!-- 4 White Laces Bars across instep -->
    <path fill="#ffffff" stroke="#1b1516" stroke-width="2.5" stroke-linejoin="round" d="M383 1368 L436 1369 L431 1378 L378 1377 Z" />
    <path fill="#ffffff" stroke="#1b1516" stroke-width="2.5" stroke-linejoin="round" d="M373 1382 L426 1384 L421 1393 L368 1391 Z" />
    <path fill="#ffffff" stroke="#1b1516" stroke-width="2.5" stroke-linejoin="round" d="M363 1396 L416 1399 L411 1408 L358 1405 Z" />
    <path fill="#ffffff" stroke="#1b1516" stroke-width="2.5" stroke-linejoin="round" d="M353 1410 L407 1414 L402 1423 L348 1419 Z" />

    <!-- Lateral purple canvas quarter (heel counter / side panel) -->
    <path fill="#5e3364" stroke="#1b1516" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" d="M440 1362 L468 1372 L472 1436 L404 1444 L440 1362 Z" />
    <!-- Heel shadow/contour accent -->
    <path fill="#432247" d="M455 1370 L468 1372 L472 1436 L458 1438 Z" />

    <!-- White rubber toe cap (Solid 3D volume matching source) -->
    <!-- Top slope facet -->
    <path fill="#ffffff" stroke="#1b1516" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" d="M346 1420 L404 1424 L404 1444 L345 1448 L308 1436 Z" />
    <!-- Front vertical face facet -->
