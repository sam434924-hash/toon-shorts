    <!-- Thick Rubber Sole (continuous, clean, solid outline) -->
    <path fill="#f4f6f9" stroke="#1b1516" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" d="M305 1446 L338 1457 L404 1444 L472 1436 L474 1455 L465 1466 L340 1468 L305 1458 Z" />
    <!-- Sole groove / bottom contour shadow -->
    <path fill="#e0e4e9" stroke="#1b1516" stroke-width="2" stroke-linejoin="round" d="M307 1453 L340 1463 L466 1461 L465 1466 L340 1468 L305 1458 Z" />
  </g>
