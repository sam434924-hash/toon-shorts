<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <g id="layer_torso">
    <!-- Interior hood opening behind neck -->
    <path fill="#274567" stroke="#1b1516" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M420 475 C440 435 560 435 580 475 C605 525 395 525 420 475 Z" />
    <!-- Torso main shadow -->
    <path fill="#3b689a" stroke="#1b1516" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M395 520 L370 805 L630 805 L605 520 Z" />
    <!-- Torso main base -->
    <path fill="#4f82ba" stroke="#1b1516" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M405 515 C440 528 560 528 595 515 L622 805 L378 805 Z" />
    <!-- Waistband / hem (covers upper leg joint overlap) -->
    <rect x="370" y="805" width="260" height="68" rx="6" fill="#3b689a" stroke="#1b1516" stroke-width="6" />
    <rect x="375" y="805" width="250" height="62" rx="4" fill="#4f82ba" stroke="#1b1516" stroke-width="4" />
    <!-- Kangaroo pocket -->
    <path fill="#3b689a" stroke="#1b1516" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M415 690 L445 690 L435 790 L405 790 Z" />
    <path fill="#3b689a" stroke="#1b1516" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M585 690 L555 690 L565 790 L595 790 Z" />
    <path fill="#4f82ba" stroke="#1b1516" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M440 690 L560 690 L585 790 L415 790 Z" />
    <line x1="415" y1="790" x2="440" y2="690" stroke="#1b1516" stroke-width="5" stroke-linecap="round" />
    <line x1="585" y1="790" x2="560" y2="690" stroke="#1b1516" stroke-width="5" stroke-linecap="round" />
    <!-- Center zipper seam -->
    <line x1="500" y1="535" x2="500" y2="865" stroke="#1b1516" stroke-width="5" stroke-linecap="round" />
    <rect x="496" y="545" width="8" height="16" rx="2" fill="#d2d7de" stroke="#1b1516" stroke-width="3" />
    <!-- Front hood collar wrap -->
    <path fill="#4f82ba" stroke="#1b1516" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M415 480 C440 535 490 545 500 545 C510 545 560 535 585 480 C555 518 445 518 415 480 Z" />
    <!-- Drawstrings -->
    <path fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" d="M465 535 L465 615" />
    <rect x="462" y="615" width="6" height="20" rx="2" fill="#d2d7de" stroke="#2b1d1f" stroke-width="2.5" />
    <path fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" d="M535 535 L535 615" />
    <rect x="532" y="615" width="6" height="20" rx="2" fill="#d2d7de" stroke="#2b1d1f" stroke-width="2.5" />
  </g>
</svg>