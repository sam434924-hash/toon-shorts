<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data: file:; style-src 'self' 'unsafe-inline' file:; script-src 'self' 'unsafe-inline' file:; font-src 'self' data: file:; media-src 'self' file:; connect-src 'none'; frame-src 'none'; object-src 'none'; form-action 'none';">
  <title>ToonShorts Whiteboard Studio</title>
  <style>
{{STYLE_CSS}}

{{DYNAMIC_CSS}}
  </style>
  <script>
{{ROUGH_JS}}
  </script>
  <script>
{{ANIME_JS}}
  </script>
</head>
<body class="theme-{{THEME_NAME}}{{PARALLAX_CLASS}}{{SPLIT_ZONES_CLASS}}">
  <div id="camera-viewport">
    <!-- 3 Multiplane Parallax Background Depth Layers (Far, Mid, Near) -->
    <div id="bg-layer-far" class="depth-layer layer-bg-far" data-depth-factor="0.08">
{{BG_FAR_CONTENT}}
    </div>
    <div id="bg-layer-mid" class="depth-layer layer-bg-mid" data-depth-factor="0.18">
{{BG_MID_CONTENT}}
    </div>
    <div id="bg-layer-near" class="depth-layer layer-bg-near" data-depth-factor="0.32">
{{BG_NEAR_CONTENT}}
    </div>

    <!-- Main Whiteboard Content Layer (Depth: 0.5) -->
    <div id="board-container" class="depth-layer layer-board" data-depth-factor="0.5">
      <div id="board-card">
        <div id="board-header">
          <span id="title-badge">{{TITLE_BADGE_TEXT}}</span>
        </div>
        <div id="board-stage">
          <!-- 4 Fixed Layout Slots for Stage Visuals & Board Objects (Phase 4B-4) -->
          <div id="board-slot-top" class="board-slot"></div>
          <div id="board-slot-center" class="board-slot">
            <svg id="stage-svg" viewBox="0 0 760 385" width="760" height="385"></svg>
            <div id="stage-visuals-container">
{{STAGE_VISUALS_HTML}}
            </div>
          </div>
          <div id="board-slot-mid" class="board-slot"></div>
          <div id="board-slot-bottom" class="board-slot"></div>
        </div>
      </div>
    </div>

    <!-- Active Speaker / Character Layer (Depth: 1.0) -->
    <div id="characters-layer" class="depth-layer layer-subject" data-depth-factor="1.0">
{{CHARACTER_RIG_HTML}}
    </div>

    <!-- Foreground Elements Layer (Depth: 2.0) -->
    <div id="foreground-layer" class="depth-layer layer-foreground" data-depth-factor="2.0">
      <!-- Word synchronized cards container -->
      <div id="words-container">
{{WORD_CARDS_HTML}}
      </div>
    </div>
  </div>

  <!-- Runtime Data Injections -->
  <script>
    window.__totalDurationMs = {{TOTAL_DURATION_MS}};
    window.__fps = {{FPS}};
    window.__mouthCues = {{MOUTH_CUES_JSON}};
    window.__annotations = {{ANNOTATIONS_JSON}};
    window.__stageVisuals = {{STAGE_VISUALS_JSON}};
    window.__cameraShotList = {{CAMERA_SHOT_LIST_JSON}};
    window.__enablePurposefulCamera = {{ENABLE_PURPOSEFUL_CAMERA}};
    window.__wordTimings = {{WORD_TIMINGS_JSON}};
    window.__roughSeed = {{ROUGH_SEED}};
    window.__isFast = {{IS_FAST}};
    window.__enableBoardObjects = {{ENABLE_BOARD_OBJECTS}};
    window.__boardObjects = {{BOARD_OBJECTS_JSON}};
    window.__enableSplitCameraZones = {{ENABLE_SPLIT_CAMERA_ZONES}};
    window.__splitCameraFraming = {{SPLIT_CAMERA_FRAMING_JSON}};
    window.__splitCharShots = {{SPLIT_CHAR_SHOTS_JSON}};
    window.__splitBoardShots = {{SPLIT_BOARD_SHOTS_JSON}};

    window.__timeline = anime.timeline({
      autoplay: false,
      duration: {{TOTAL_DURATION_MS}}
    });
    window.__mainTimeline = window.__timeline;

    window.__timeline
{{TIMELINE_CHAIN}};
  </script>

  <!-- Safe JSON text payload for XSS-free textContent setting -->
  <script id="wb-safe-text-payload" type="application/json">{{SAFE_TEXT_JSON}}</script>
  <!-- Safe JSON board objects payload for XSS-free textContent setting (Phase 4B-4) -->
  <script id="board-objects-payload" type="application/json">{{BOARD_OBJECTS_PAYLOAD_JSON}}</script>

  <!-- Local modular template scripts loaded in fixed order -->
  <script id="module-rough-draw">
{{ROUGH_DRAW_JS}}
  </script>
  <script id="module-stage-visuals">
{{STAGE_VISUALS_JS}}
  </script>
  <script id="module-camera-engine">
{{CAMERA_ENGINE_JS}}
  </script>
  <script id="module-gestures-fk">
{{GESTURES_FK_JS}}
  </script>
  <script id="module-main">
{{MAIN_JS}}
  </script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          if (typeof initRoughSketches === "function") {
            initRoughSketches();
          }
          window.seekTo(0);
        });
      } else {
        if (typeof initRoughSketches === "function") {
          initRoughSketches();
        }
        window.seekTo(0);
      }
    });
  </script>
</body>
</html>
